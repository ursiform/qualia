name: Deploy JupyterLite Demo to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "lite/**"
      - "pyproject.toml"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Setup GitHub Pages
        uses: actions/configure-pages@v6
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install build tools and JupyterLite
        run: |
          python -m pip install --upgrade pip build
          python -m pip install jupyter-server jupyterlite-core jupyterlite-pyodide-kernel
      - name: Build Qualia wheel
        run: |
          python -m build --wheel
      - name: Build JupyterLite site
        run: |
          jupyter lite build --config lite/jupyter_lite_config.json
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: "dist/lite"
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
